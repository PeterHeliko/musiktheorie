# Bei jedem Push auf main: prüfen, bauen, auf GitHub Pages veröffentlichen.
#
# Veröffentlicht wird, was Unit-Tests und Build besteht. Die Browserprüfung
# (npm run e2e) läuft hier vorerst NICHT — während der Entwicklung soll ein
# Push schnell online sein. Vor dem Push lokal `npm run verify` laufen lassen.
# Zurückholen: die beiden Schritte «Browser für die Browserprüfung»
# (npx playwright install --with-deps chromium) und «npm run e2e» nach dem
# Build wieder einfügen.
#
# Einmalig im Repository einstellen: Settings → Pages → Source: «GitHub Actions».

name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
